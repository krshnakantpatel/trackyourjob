name : Node.js CI/CD with Docker

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18  # Specify a version instead of using matrix
        cache: 'npm'
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json

    - name: Install and test client
      run: |
        cd client
        npm ci
        npm test
    
    - name: Install and test server
      run: |
        cd server
        npm ci
        npm test

  docker-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest  
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/trackyourjob:latest

    - name: Deploy to AWS EC2 via Docker
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/trackyourjob:latest
          docker stop trackyourjob || true
          docker rm trackyourjob || true
          docker run -d --name trackyourjob -p 80:5000 ${{ secrets.DOCKER_USERNAME }}/trackyourjob:latest
